<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="0" fill="#F8F7F4"/>

  <!-- Warm gradient background wash -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF3EC"/>
      <stop offset="100%" stop-color="#F8F7F4"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E86A3A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E86A3A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="480" rx="380" ry="340" fill="url(#glow)"/>

  <!-- Devanagari भ — the identity mark of Bhasha -->
  <!-- Rendered large, centred, in brand orange -->
  <text
    x="512"
    y="590"
    text-anchor="middle"
    font-family="'Noto Sans Devanagari', 'Devanagari MT', serif"
    font-weight="900"
    font-size="580"
    fill="#E86A3A"
    letter-spacing="-10"
  >भ</text>

  <!-- Subtle underline accent bar -->
  <rect x="312" y="720" width="400" height="16" rx="8" fill="#E86A3A" opacity="0.25"/>
</svg>
